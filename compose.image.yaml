services:
  komari:
    image: ghcr.io/coolman1232004/komari-classic:v1.2.5-fix2-security.2@sha256:34fab72ca869f7f58895e6916cc490cbccf9eb1bef40af771dff58be163a1701
    container_name: komari-classic-security
    restart: unless-stopped
    ports:
      - "127.0.0.1:25775:25774"
    volumes:
      - komari-classic-security-data:/app/data
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  komari-classic-security-data:
