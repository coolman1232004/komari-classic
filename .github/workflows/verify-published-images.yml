name: Verify published Docker images
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published immutable release tag to pull and verify
        required: true
        default: v1.2.5-fix2-security.3
        type: string
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      IMAGE_BASE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - name: Pull published images without registry credentials
        run: |
          docker pull "${IMAGE_BASE}:${RELEASE_TAG}"
          docker pull "${IMAGE_BASE}-agent:${RELEASE_TAG}"
          docker tag "${IMAGE_BASE}:${RELEASE_TAG}" komari-classic:1.2.5-fix2-hardening
          docker tag "${IMAGE_BASE}-agent:${RELEASE_TAG}" komari-agent:test
          mkdir -p image-audit
          docker image inspect "${IMAGE_BASE}:${RELEASE_TAG}" "${IMAGE_BASE}-agent:${RELEASE_TAG}" > image-audit/inspected-images.json
      - name: Check published installation, authentication and persistence
        run: |
          mkdir -p data
          docker run -d --name komari-smoke -p 127.0.0.1:25774:25774 -v "$PWD/data:/app/data" --security-opt no-new-privileges:true -e ADMIN_USERNAME=ci-admin -e ADMIN_PASSWORD=ci-test-password "${IMAGE_BASE}:${RELEASE_TAG}"
          python3 scripts/docker-smoke.py
          docker stop komari-smoke
          sudo python3 scripts/docker-password-check.py --seed-legacy
          docker start komari-smoke
          python3 scripts/docker-smoke.py
          sudo python3 scripts/docker-password-check.py
          docker run --rm --entrypoint cloudflared "${IMAGE_BASE}:${RELEASE_TAG}" --version
          docker run --rm --entrypoint sh komari-agent:test -c 'test -s /etc/ssl/certs/ca-certificates.crt && test -f /.komari-agent-container'
      - name: Verify published image backup and restore
        run: python3 scripts/docker-backup-check.py
      - name: Scan the actual published images
        run: |
          docker save komari-classic:1.2.5-fix2-hardening -o image-audit/server.tar
          docker save komari-agent:test -o image-audit/agent.tar
          for component in server agent; do
            docker run --rm -v "$PWD/image-audit:/scan" ghcr.io/aquasecurity/trivy:0.73.0 image --scanners vuln --input /scan/$component.tar --format json --output /scan/$component.json
          done
          python3 scripts/image-audit-summary.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: published-image-reports-${{ matrix.runner }}
          path: image-audit/*.json
      - name: Cleanup
        if: always()
        run: |
          if [ "${{ job.status }}" != "success" ]; then docker logs komari-smoke || true; fi
          docker rm -f komari-smoke || true
