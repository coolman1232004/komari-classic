services:
  komari:
    build:
      context: .
      dockerfile: Dockerfile.source
    image: komari-classic:1.2.5-fix2-hardening
    container_name: komari
    restart: unless-stopped
    ports:
      - "${KOMARI_BIND_ADDRESS:-127.0.0.1}:25774:25774"
    volumes:
      - ./data:/app/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
